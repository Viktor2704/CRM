openapi: 3.0.3
info:
  title: Novinzhstroy API
  description: |
    Comprehensive API for the Novinzhstroy project management system.

    ## Authentication
    This API uses JWT-based authentication with refresh tokens stored in HTTP-only cookies.

    ## Rate Limiting
    Authentication endpoints are rate-limited to prevent abuse.

    ## Versioning
    All endpoints are versioned under `/api/v1/` prefix.
  version: 1.0.0
  contact:
    name: API Support
    email: support@novinzhstroy.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000/api/v1
    description: Development server
  - url: https://api.novinzhstroy.com/api/v1
    description: Production server

tags:
  - name: Health
    description: Health check and monitoring endpoints
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management operations
  - name: Tenants
    description: Tenant (client organization) management
  - name: Projects
    description: Project management and tracking
  - name: Installations
    description: Installation project management
  - name: Service Requests
    description: Service request and maintenance ticket management
  - name: Maintenance Plans
    description: Maintenance planning and scheduling
  - name: Calendar
    description: Calendar events and scheduling
  - name: Notifications
    description: In-app notifications
  - name: Files
    description: File upload and management
  - name: Reports
    description: Report generation and export
  - name: AI
    description: AI-powered suggestions and analysis
  - name: Dashboard
    description: Dashboard metrics and analytics

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from login endpoint

    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HTTP-only refresh token cookie

  schemas:
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message
          example: Invalid input data
        details:
          type: object
          description: Additional error details

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        service:
          type: string
          example: novinzhstroy-backend

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, degraded]
          example: ready
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [up, down, mock]
              example: up

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: SecurePassword123

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (valid for 15 minutes)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          format: email
          example: user@example.com
        fullName:
          type: string
          example: John Doe
        role:
          type: string
          enum: [admin, manager, engineer, client, viewer]
          example: manager
        status:
          type: string
          enum: [active, invited, blocked, deactivated]
          example: active
        tenantId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Acme Corporation
        brandName:
          type: string
          example: ACME
        inn:
          type: string
          example: "1234567890"
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/TenantContact'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TenantContact:
      type: object
      properties:
        fullName:
          type: string
          example: Jane Smith
        email:
          type: string
          format: email
          example: jane@acme.com
        phone:
          type: string
          example: "+79001234567"

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Office Ventilation System
        description:
          type: string
          example: Installation of new ventilation system
        tenantId:
          type: string
          format: uuid
        directionId:
          type: string
          format: uuid
        systemType:
          type: string
          enum: [ventilation, heating, cooling, plumbing, electrical, other]
          example: ventilation
        priority:
          type: string
          enum: [low, medium, high, critical]
          example: high
        status:
          type: string
          enum: [new, in_progress, review, done, cancelled]
          example: in_progress
        stage:
          type: string
          example: design
        responsibleIds:
          type: array
          items:
            type: string
            format: uuid
        dueDatePreliminary:
          type: string
          format: date
          nullable: true
        dueDateAdmin:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ServiceRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Emergency repair needed
        description:
          type: string
          example: Water leak in building A
        type:
          type: string
          enum: [emergency, planned, inspection, consultation]
          example: emergency
        status:
          type: string
          enum: [new, triage, assigned, in_progress, on_site, review, paused, done, closed, cancelled]
          example: assigned
        priority:
          type: string
          enum: [low, medium, high, critical]
          example: critical
        systemType:
          type: string
          example: plumbing
        tenantId:
          type: string
          format: uuid
        assignedToId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          example: project_status_changed
        title:
          type: string
          example: Project status updated
        message:
          type: string
          example: Project "Office Ventilation" moved to review stage
        read:
          type: boolean
          example: false
        payload:
          type: object
        createdAt:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 5

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags:
        - Health
      summary: Readiness check
      description: Returns the readiness status including database connectivity
      operationId: getReadiness
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login with email and password
      description: Authenticate user and receive access token and refresh token cookie
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=abc123; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account disabled or pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Use refresh token cookie to obtain a new access token
      operationId: refreshToken
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Invalidate refresh token and clear cookies
      operationId: logout
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully

  /users:
    get:
      tags:
        - Users
      summary: List users
      description: Get paginated list of users with optional filtering
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Users
      summary: Create user
      description: Create a new user account
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - fullName
                - role
              properties:
                email:
                  type: string
                  format: email
                fullName:
                  type: string
                role:
                  type: string
                tenantId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve detailed information about a specific user
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Users
      summary: Update user
      description: Update user information
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                role:
                  type: string
                status:
                  type: string
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Delete a user account
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tenants:
    get:
      tags:
        - Tenants
      summary: List tenants
      description: Get paginated list of tenant organizations
      operationId: listTenants
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Tenants
      summary: Create tenant
      description: Create a new tenant organization
      operationId: createTenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                brandName:
                  type: string
                inn:
                  type: string
                contacts:
                  type: array
                  items:
                    $ref: '#/components/schemas/TenantContact'
      responses:
        '201':
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

  /projects:
    get:
      tags:
        - Projects
      summary: List projects
      description: Get paginated list of projects with filtering and sorting
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: tenantId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Projects
      summary: Create project
      description: Create a new project
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - tenantId
                - systemType
              properties:
                title:
                  type: string
                description:
                  type: string
                tenantId:
                  type: string
                  format: uuid
                directionId:
                  type: string
                  format: uuid
                systemType:
                  type: string
                priority:
                  type: string
                responsibleIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /service-requests:
    get:
      tags:
        - Service Requests
      summary: List service requests
      description: Get paginated list of service requests
      operationId: listServiceRequests
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of service requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceRequest'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Service Requests
      summary: Create service request
      description: Create a new service request
      operationId: createServiceRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - type
              properties:
                title:
                  type: string
                description:
                  type: string
                type:
                  type: string
                priority:
                  type: string
                systemType:
                  type: string
                tenantId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Service request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'

  /notifications:
    get:
      tags:
        - Notifications
      summary: List notifications
      description: Get user's notifications
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'

  /notifications/{notificationId}/read:
    post:
      tags:
        - Notifications
      summary: Mark notification as read
      description: Mark a specific notification as read
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /files/upload:
    post:
      tags:
        - Files
      summary: Upload file
      description: Upload a file to the system
      operationId: uploadFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                entityType:
                  type: string
                  example: project
                entityId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileId:
                    type: string
                    format: uuid
                  url:
                    type: string
                  filename:
                    type: string
                  size:
                    type: integer

  /dashboard/metrics:
    get:
      tags:
        - Dashboard
      summary: Get dashboard metrics
      description: Retrieve key metrics for the dashboard
      operationId: getDashboardMetrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeProjects:
                    type: integer
                  openServiceRequests:
                    type: integer
                  upcomingDeadlines:
                    type: integer
                  recentActivity:
                    type: array
                    items:
                      type: object

  /ai/suggest:
    post:
      tags:
        - AI
      summary: Get AI suggestions
      description: Get AI-powered suggestions for service request classification
      operationId: getAiSuggestions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  maxLength: 2000
                  example: Water leak in the basement
      responses:
        '200':
          description: AI suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  systemType:
                    type: string
                  priority:
                    type: string
                  confidence:
                    type: number
                    format: float
